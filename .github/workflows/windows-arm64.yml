name: Build on Windows ARM64

on:
  push:
    branches:
      - 'main'
      - 'bb-*'
      - '[0-9]+.[0-9]+'
      - '*wlad*'
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: p16-rpl
            parallel: 16
            extra: ''
          - name: p32-rpl
            parallel: 32
            extra: ''
          - name: p48-rpl
            parallel: 48
            extra: ''
          - name: p32-rpl-poolmax1g
            parallel: 32
            extra: '--mysqld=--loose-innodb-buffer-pool-size-max=1G'

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.name }}
      cancel-in-progress: true

    timeout-minutes: 150
    runs-on: windows-11-arm

    steps:
      - name: Configure git
        run: |
          # We won't be able to successfully run mtr
          # unless we configure autocrlf.
          git config --global core.autocrlf input

      - uses: actions/checkout@v6

      - name: Get cache key
        id: week
        # Refresh weekly, so the cached bison does not get stale.
        run: echo "id=$(Get-Date -UFormat '%G-W%V')" >> $env:GITHUB_OUTPUT

      - name: Restore winflexbison
        id: wfb
        uses: actions/cache/restore@v4
        with:
          path: |
            C:\ProgramData\chocolatey\lib\winflexbison3
            C:\ProgramData\chocolatey\bin\win_bison.exe
            C:\ProgramData\chocolatey\bin\win_flex.exe
          key: winflexbison3-${{ steps.week.outputs.id }}
          # Fall back to an older week's copy if choco is down.
          restore-keys: winflexbison3-

      - name: Install prerequisites
        id: choco
        if: steps.wfb.outputs.cache-hit != 'true'
        run: |
          # Install bison to compile. Retry, and tolerate choco being down
          # if an older cached copy was restored.
          for ($i = 1; $i -le 3; $i++) {
            choco upgrade winflexbison3 -y --no-progress
            if ($LASTEXITCODE -eq 0) {
              echo "fresh=true" >> $env:GITHUB_OUTPUT
              exit 0
            }
            Start-Sleep -Seconds (15 * $i)
          }
          if (Test-Path C:\ProgramData\chocolatey\bin\win_bison.exe) {
            Write-Warning "choco failed, using the previously cached winflexbison3"
            exit 0
          }
          exit 1

      - name: Build
        run: |
          # speedup checkout by excluding uninteresting modules
          git config submodule.storage/columnstore/columnstore.update none
          git config submodule.storage/maria/libmarias3.update none
          git config submodule.storage/rocksdb/rocksdb.update none
          git config submodule.wsrep-lib.update none
          mkdir bld
          cd bld
          cmake .. -DWITH_SSL=bundled
          cmake --build . --config RelWithDebinfo --verbose -- -m

      - name: System info
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host ("{0} {1}; CPUs {2}" -f $os.Caption, $os.Version, $env:NUMBER_OF_PROCESSORS)
          Write-Host ("RAM {0:N1} GB, commit limit {1:N1} GB" -f ($os.TotalVisibleMemorySize/1MB), ($os.TotalVirtualMemorySize/1MB))
          Get-CimInstance Win32_PageFileUsage | Format-List Name, AllocatedBaseSize, CurrentUsage
          Write-Host "Memory counters available to the sampler:"
          (Get-Counter -ListSet Memory).Counter | Where-Object { $_ -match 'Commit|Pool|Page Table|Available' }

      - name: Test MTR
        run: |
          $env:PATH = "C:\Strawberry\perl\bin;$env:PATH;C:\Program Files (x86)\Windows Kits\10\Debuggers\arm64"
          $parallel = ${{ matrix.parallel }}
          $extra = '${{ matrix.extra }}'
          # case-sensitive directory on the system drive, as before
          $tmp = (Get-Item $env:TEMP).FullName -replace '\\','/'
          $cidir = "$tmp/ci"
          mkdir $cidir
          fsutil file setCaseSensitiveInfo $cidir enable
          "MTR_CIDIR=$cidir" >> $env:GITHUB_ENV

          # Background sampler: system commit/pool/page-table counters, plus
          # number and total private memory of the server processes
          @'
          param($out)
          $names = (Get-Counter -ListSet Memory).Counter | Where-Object { $_ -match 'Commit|Pool|Page Table|Available' }
          while ($true) {
            $s = (Get-Counter $names -ErrorAction SilentlyContinue).CounterSamples
            $c = ($s | ForEach-Object {
              $n = ($_.Path -replace '^.*\\memory\\','')
              if ($n -match 'mbytes') { '{0}={1}' -f $n, [int64]$_.CookedValue }
              elseif ($n -match 'bytes') { '{0}={1}MB' -f $n, [int64]($_.CookedValue/1MB) }
              else { '{0}={1}' -f $n, [int64]$_.CookedValue } }) -join ' '
            $p = Get-Process mariadbd -ErrorAction SilentlyContinue
            '{0:HH:mm:ss} servers={1} serversPrivate={2}MB {3}' -f (Get-Date), @($p).Count,
              [int](($p | Measure-Object PrivateMemorySize64 -Sum).Sum / 1MB), $c | Add-Content -Path $out
            Start-Sleep -Seconds 5
          }
          '@ | Set-Content "$cidir/sampler.ps1"
          $sampler = Start-Process pwsh -ArgumentList '-NoProfile','-File',"$cidir/sampler.ps1","$cidir/mem-samples.log" -PassThru -WindowStyle Hidden

          $rc = 0
          try {
            foreach ($run in 1..2) {
              if (Test-Path "$cidir/var") { Remove-Item -Recurse -Force "$cidir/var" }
              $t0 = Get-Date
              perl bld\mysql-test\mysql-test-run.pl --force --parallel=$parallel --suite=main,innodb,parts,rpl --vardir=$cidir/var --mysqld=--lower-case-table-names=0 --mysqld=--loose-innodb-flush-log-at-trx-commit=2 --mysqld=--debug-no-sync $extra.Split(' ', [StringSplitOptions]::RemoveEmptyEntries) 2>&1 | Tee-Object -FilePath "$cidir/mtr-$run.log"
              $r = $LASTEXITCODE
              $dur = [int]((Get-Date) - $t0).TotalMinutes
              $log = Get-Content "$cidir/mtr-$run.log"
              $failed = @($log | Select-String '\[ fail \]').Count
              $oom = @($log | Select-String 'Out of memory|Cannot allocate|not enough memory|EE_OUTOFMEMORY|my_malloc').Count
              $crash = @(Get-ChildItem "$cidir/var" -Recurse -Include *.err -ErrorAction SilentlyContinue |
                Select-String 'got exception|Assertion .* failed').Count
              $line = "${{ matrix.name }} run ${run}: exit=$r minutes=$dur failedTests=$failed oomMessages=$oom crashMessages=$crash"
              Write-Host "SUMMARY $line"
              $line >> $env:GITHUB_STEP_SUMMARY
              Copy-Item -Recurse -Force "$cidir/var/log" "$cidir/log-run$run" -ErrorAction SilentlyContinue
              Get-ChildItem "$cidir/var" -Recurse -Include *.err -ErrorAction SilentlyContinue |
                Select-String 'got exception|Out of memory|EE_OUTOFMEMORY|Cannot allocate' |
                Select-Object -First 50 | ForEach-Object { "$($_.Path):$($_.LineNumber): $($_.Line)" } |
                Set-Content "$cidir/errors-run$run.txt"
              if ($r -ne 0) { $rc = $r }
            }
          } finally {
            Stop-Process -Id $sampler.Id -Force -ErrorAction SilentlyContinue
          }
          exit $rc

      - name: Failure details
        if: always()
        run: |
          $cidir = $env:MTR_CIDIR
          if (Test-Path "$cidir/mem-samples.log") { "=== mem-samples.log (last 30)"; Get-Content "$cidir/mem-samples.log" -Tail 30 }
          "=== memory-related messages in server logs"
          Get-ChildItem "$cidir/var" -Recurse -Include *.err -ErrorAction SilentlyContinue |
            Select-String -Pattern 'Cannot map innodb_buffer_pool_size_max|Out of memory|EE_OUTOFMEMORY|Cannot allocate memory|not enough memory|got exception' -ErrorAction SilentlyContinue |
            Select-Object -First 40 | ForEach-Object { "$($_.Path):$($_.LineNumber): $($_.Line)" }

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mtr-${{ matrix.name }}
          path: |
            ${{ env.MTR_CIDIR }}/mem-samples.log
            ${{ env.MTR_CIDIR }}/mtr-*.log
            ${{ env.MTR_CIDIR }}/errors-run*.txt
            ${{ env.MTR_CIDIR }}/log-run*
          if-no-files-found: ignore
